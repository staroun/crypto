<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    <script>
        var id = new URLSearchParams(window.location.search).get('id');
        window.location.replace('index.html' + (id ? '?id=' + id : ''));
    </script>
</head>
<body></body>
</html>
